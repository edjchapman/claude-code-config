name: Lint PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

# Cancel in-flight runs when a PR is updated quickly in succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  conventional-commits:
    name: Validate PR title follows Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Check title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed types — keep in sync with CONTRIBUTING.md and .pre-commit-config.yaml.
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            test
            ci
            perf
            build
            revert
          # Scope is optional (e.g. `feat(skills):` or just `feat:`).
          requireScope: false
          # Disallow merge-commit-style titles that PR-edit UIs sometimes
          # produce: `Merge pull request #N from branch`.
          subjectPattern: "^(?![A-Z]).+$"
          subjectPatternError: |
            The PR title's subject (after `type(scope):`) should start with a
            lowercase letter. Examples:
              feat(skills): add ruby workflow skill
              chore: bump actions/checkout to v5
              fix(scripts): handle spaces in paths
          # The repo uses squash-merge — only the PR title becomes the
          # commit subject. We don't validate every PR commit message.
          validateSingleCommit: false

  no-claude-attribution:
    # The `attribution` settings key only suppresses what the harness appends;
    # a trailer the model types gets through with no error (#130). The
    # `edited` trigger above is what re-runs this when only the body changes.
    name: Check commits and PR body carry no Claude attribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the check walks base..head.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Run check-attribution.py
        # The PR body is untrusted, so the script reads it from the event
        # payload file. It is never interpolated into this command.
        run: python3 scripts/check-attribution.py --event "$GITHUB_EVENT_PATH"
