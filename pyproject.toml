# Minimal pyproject.toml — only used to configure ruff for the two
# utility scripts in scripts/. This repo isn't a Python package and
# isn't installed via pip; no [project] table is needed.

[tool.ruff]
target-version = "py38"
line-length = 100
# tooling/ is vendored payload copied verbatim into other repos. It is NOT
# excluded from lint/format: the payload becomes the downstream project's own
# source and is held to that project's gate, so it must meet the strictest
# standard it will face. Excluding it here shipped unformatted Python that
# failed a freshly-bootstrapped project's `make check` on the first run.

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
]
ignore = [
  # Allow `assert` statements — these scripts aren't long-running services.
  "S101",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
